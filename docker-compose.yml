services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: desafio-rabbitmq
    ports:
      - "5672:5672"    # porta AMQP (a aplicação conecta aqui)
      - "15672:15672"  # painel de administração web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5