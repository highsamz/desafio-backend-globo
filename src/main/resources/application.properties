spring.application.name=globo

# RabbitMQ — externalizado, com default pra rodar local fora do compose
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# MongoDB — mesmo padrão externalizado (host 'mongo' no compose, 'localhost' fora)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/globo}

# Nome da fila (lido pelo SubscriptionQueueProperties)
broker.queue.subscription.name=subscription.queue

# HTTP em virtual threads — aquele "de graça" que discutimos
spring.threads.virtual.enabled=true