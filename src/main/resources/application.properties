spring.application.name=globo

# RabbitMQ — externalizado, com default pra rodar local fora do compose
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Nome da fila (lido pelo SubscriptionQueueProperties)
broker.queue.subscription.name=subscription.queue

# HTTP em virtual threads — aquele "de graça" que discutimos
spring.threads.virtual.enabled=true